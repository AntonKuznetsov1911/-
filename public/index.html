<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-header">
            <h1>🎮 Кликер Игра</h1>
            <div class="user-info">
                <span id="username">Игрок</span>
            </div>
        </div>

        <div class="game-content">
            <div class="score-display">
                <h2>Счёт</h2>
                <div class="score" id="score">0</div>
            </div>

            <div class="click-area">
                <button class="click-button" id="clickButton">
                    <span class="button-emoji">💎</span>
                </button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Кликов в секунду:</span>
                    <span class="stat-value" id="cps">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Всего кликов:</span>
                    <span class="stat-value" id="totalClicks">0</span>
                </div>
            </div>

            <div class="upgrades">
                <h3>Улучшения</h3>
                <div class="upgrade-list">
                    <div class="upgrade-item" id="upgrade1">
                        <div class="upgrade-info">
                            <span class="upgrade-name">🤖 Авто-клик</span>
                            <span class="upgrade-desc">+1 клик/сек</span>
                        </div>
                        <button class="upgrade-button" onclick="buyUpgrade(1, 10)">
                            Купить (10)
                        </button>
                    </div>
                    <div class="upgrade-item" id="upgrade2">
                        <div class="upgrade-info">
                            <span class="upgrade-name">⚡ Мощность клика</span>
                            <span class="upgrade-desc">+2 за клик</span>
                        </div>
                        <button class="upgrade-button" onclick="buyUpgrade(2, 25)">
                            Купить (25)
                        </button>
                    </div>
                    <div class="upgrade-item" id="upgrade3">
                        <div class="upgrade-info">
                            <span class="upgrade-name">🚀 Турбо режим</span>
                            <span class="upgrade-desc">+5 клик/сек</span>
                        </div>
                        <button class="upgrade-button" onclick="buyUpgrade(3, 100)">
                            Купить (100)
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="leaderboard">
            <h3>🏆 Рекорд</h3>
            <div id="highScore">0</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
